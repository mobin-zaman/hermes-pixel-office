<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hermes Pixel Office</title>
<style>
  html,body{margin:0;height:100%;background:#1a1423;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;height:100%}
  #hdr{color:#e8c170;padding:7px 14px;font-size:13px;letter-spacing:1px;
    border-bottom:2px solid #3a2f4b;display:flex;justify-content:space-between;
    align-items:center;gap:10px}
  #hdr .dim{color:#7a6f8f}
  #hdr .btn{cursor:pointer;color:#cfc4e8;border:1px solid #3a2f4b;
    border-radius:3px;padding:2px 8px;font-size:12px;background:#241c30;
    user-select:none}
  #hdr .btn:hover{border-color:#e8c170;color:#e8c170}
  #hdr .btn.on{color:#5fce7a;border-color:#5fce7a}
  #hdr .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tick{height:22px;background:#241c30;border-bottom:2px solid #3a2f4b;
    color:#cfc4e8;font-size:12px;overflow:hidden;white-space:nowrap;
    padding:3px 14px;box-sizing:border-box;letter-spacing:.3px}
  #tick b{color:#e8c170;font-weight:bold}
  #tick .tk{margin-right:22px;vertical-align:middle}
  #tick .tk.empty{color:#7a6f8f}
  #tick .dot{display:inline-block;width:7px;height:7px;border-radius:2px;
    margin-right:6px;vertical-align:1px}
  canvas{flex:1;image-rendering:pixelated;width:100%;height:100%;touch-action:none}
  @media (max-width:560px){
    #hdr{padding:6px 10px;flex-wrap:wrap;gap:6px 10px;font-size:12px}
    #hdr .t{font-size:11px}
    #hdr .dim{font-size:11px}
    #hdr .btn{font-size:11px;padding:3px 8px}
    #tick{font-size:11px;padding:2px 10px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <span class="t">☤ HERMES PIXEL OFFICE</span>
    <span style="flex:1"></span>
    <span class="dim" id="count">connecting…</span>
    <span class="btn" id="sound" title="chime when an agent needs approval or a subagent finishes">♪ sound off</span>
    <span class="btn" id="spawn" style="display:none" title="open a terminal running hermes">+ agent</span>
  </div>
  <div id="tick"><span class="tk empty">◌ no tool calls yet</span></div>
  <canvas id="c"></canvas>
</div>
<script>
"use strict";
// ── host detection ──────────────────────────────────────────────────────
const IN_VSCODE = typeof acquireVsCodeApi !== "undefined";
const vsapi = IN_VSCODE ? acquireVsCodeApi() : null;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let S = 4;                                  // pixel scale (auto-shrinks if crowded)
let agents = [], frame = 0, offline = null;

// ── palettes / sprites ──────────────────────────────────────────────────
const SKIN=["#f0c8a0","#c68b59","#8d5524","#ffdbac","#e0ac69","#a1665e"];
const SHIRT=["#4fa4d8","#d84f6f","#5fce7a","#c9a227","#9b6fd8","#d87f4f"];
const HAIR=["#2b2b2b","#5a3825","#c9a227","#8a8a8a","#7a3030","#4a6741"];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function px(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x*S),Math.round(y*S),w*S,h*S)}

// ── office scene ────────────────────────────────────────────────────────
function drawOffice(w,h){
  for(let y=0;y<h;y+=8)for(let x=0;x<w;x+=8)
    px(x,y,8,8,((x+y)/8)%2?"#2a2138":"#251d31");
  px(0,0,w,6,"#3a2f4b"); px(0,6,w,1,"#241c30");            // wall
  for(let x=14;x<w-14;x+=26){px(x,1,10,4,"#151022");        // windows
    px(x+1,2,8,2,"#3b5a8f");px(x+2,2,2,1,"#7fa8d8");}
  // door (agents walk in here)
  px(1,1,7,6,"#54381f"); px(2,2,5,5,"#6b4a2f"); px(6,4,1,1,"#e8c170");
  // rug
  const rw=Math.min(24,w-10); px((w-rw)/2,h-8,rw,5,"#3a2f4b");
  px((w-rw)/2+1,h-7,rw-2,3,"#443358");
  // plant, right corner
  px(w-6,h-14,3,1,"#5fce7a");px(w-7,h-15,2,2,"#5fce7a");px(w-4,h-15,2,2,"#4aa860");
  px(w-6,h-13,2,3,"#8d5524");px(w-6,h-10,3,1,"#54381f");
  // water cooler, left side
  px(2,h-14,4,5,"#7fa8d8");px(3,h-15,2,1,"#a8c8e8");px(2,h-9,4,1,"#4a4a5a");
  px(3,h-8,2,2,"#4a4a5a");
  // coffee machine on a small table, right of door
  px(10,h-11,6,1,"#6b4a2f");px(10,h-10,6,3,"#54381f");
  px(11,h-14,4,3,"#33283f");px(12,h-13,1,1,"#d84f6f");
}
function drawDesk(x,y){
  px(x,y+10,16,1,"#6b4a2f"); px(x,y+11,16,3,"#54381f");
  px(x+1,y+14,2,4,"#3c2814"); px(x+13,y+14,2,4,"#3c2814");
  px(x+10,y+4,6,5,"#191524");                    // monitor
  px(x+12,y+9,2,1,"#4a4a5a");
}
// monitor screen color reflects activity
function deskScreen(x,y,a){
  const t=frame>>3;
  let col="#0f2c1e";
  if(a){
    if(a.activity==="running")col=(t%4<2)?"#0f3c1e":"#0f2c16";       // terminal green blink
    else if(a.activity==="browsing")col=(t%6<3)?"#1e2c4a":"#24365a"; // blue page
    else if(a.activity==="typing")col=(t%2)?"#12321e":"#0f2c1e";     // fast flicker
    else if(a.status==="waiting")col="#3c1e28";                      // dim red
  }
  px(x+11,y+5,4,3,col);
}

// ── characters ──────────────────────────────────────────────────────────
function drawChar(a,fx,fy,seated){
  const h=hash(a.id), skin=SKIN[h%SKIN.length], shirt=SHIRT[(h>>3)%SHIRT.length],
        hair=HAIR[(h>>6)%HAIR.length], t=frame>>4;
  const walking = !seated;
  const bob=((a.status==="working"||walking)&&(t%2))?1:0;
  const x=fx, y=fy+bob;
  if(a.status==="gone")ctx.globalAlpha=0.35;
  // hair — style varies per agent
  px(x+2,y,4,3,hair);
  if(h%3===0)px(x+1,y+1,1,2,hair);                 // side hair
  if(h%5===0)px(x+2,y-1,4,1,hair);                 // tall hair
  px(x+2,y+2,4,3,skin);                            // face
  if(h%4===0){px(x+2,y+3,2,1,"#222a44");px(x+4,y+3,2,1,"#222a44")} // glasses
  else{px(x+3,y+3,1,1,"#111");px(x+5,y+3,1,1,"#111")}
  px(x+1,y+5,6,5,shirt);                           // body
  if(a.kind==="subagent")px(x+1,y+5,6,1,"#e8c170");// gold collar
  px(x+0,y+6,1,3,skin); px(x+7,y+6,1,3,skin);      // arms
  if(walking){                                     // legs alternate
    if(t%2){px(x+2,y+10,1,3,"#2d2d3d");px(x+5,y+11,1,2,"#2d2d3d")}
    else{px(x+2,y+11,1,2,"#2d2d3d");px(x+5,y+10,1,3,"#2d2d3d")}
  }else{
    px(x+2,y+10,1,3,"#2d2d3d"); px(x+5,y+10,1,3,"#2d2d3d");
  }
  // activity props (seated only)
  if(seated){
    if(a.activity==="typing"&&(frame>>2)%2)px(x+7,y+8,2,1,skin);      // fast hands
    else if(a.activity==="running"&&t%2)px(x+7,y+8,2,1,skin);
    else if(a.activity==="reading"){px(x+7,y+7,3,2,"#e8e0c8");px(x+8,y+7,1,2,"#b8b0a0")} // book
    else if(a.activity==="delegating"&&t%2)px(x+8,y+6,2,1,skin);      // pointing
  }
  ctx.globalAlpha=1;
}
function drawBubble(a,x,y){
  const t=frame>>4;
  if(a.status==="waiting"){                        // needs input — loud
    const by=y-6-((frame>>3)%2);
    px(x+1,by,6,4,"#e8d8b0"); px(x+2,by+4,1,1,"#e8d8b0");
    px(x+4,by+1,1,2,"#c9302f"); px(x+4,by+3,0,0,"#c9302f");
    px(x+4,by+3,1,1,"#c9302f");
  }else if(a.status==="working"&&a.tool){
    px(x+3,y-4,3,3,"#e8c170"); px(x+4,y-3,1,1,"#1a1423");
  }else if(a.status==="thinking"){
    for(let i=0;i<3;i++)px(x+2+i*2,y-3,1,1,i<=(t%4)?"#cfc4e8":"#4a4060");
  }else if(a.status==="done"){
    px(x+2,y-4,1,1,"#5fce7a");px(x+3,y-3,1,1,"#5fce7a");
    px(x+4,y-4,1,1,"#5fce7a");px(x+5,y-5,1,1,"#5fce7a");
  }else if(a.status==="idle"&&(t%8)<4){
    px(x+6,y-4,1,1,"#7a6f8f");px(x+7,y-5,1,1,"#7a6f8f");
  }
}
function wrap(s, maxLen, maxLines) {
  if (!s) return [];
  const words = String(s).trim().split(/\s+/);
  const lines = [];
  let cur = "";
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    if (!cur) {
      cur = w.length > maxLen ? w.slice(0, maxLen) : w;
    } else if ((cur + " " + w).length <= maxLen) {
      cur += " " + w;
    } else {
      lines.push(cur);
      if (lines.length >= maxLines) { cur = ""; break; }
      cur = w.length > maxLen ? w.slice(0, maxLen) : w;
    }
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  return lines;
}

function label(a,x,y){
  ctx.font="10px ui-monospace,monospace";ctx.textAlign="center";
  ctx.fillStyle=a.kind==="subagent"?"#e8c170":"#cfc4e8";
  const plat={"telegram":"tg","desktop":"dsk","cli":"cli","server":"srv","subagent":"sub"}[a.platform]||"";
  let name = a.label || "";
  if (plat && a.platform && name.startsWith(a.platform)) {
    name = name.slice(a.platform.length).trim();
  }
  const displayName = plat ? "[" + plat + "] " + name : name;
  ctx.fillText(displayName.slice(0,16),(x+8)*S,(y+18.5)*S);
  const st=a.status==="waiting"?"needs input!"
        :a.tool?(a.tool.length>14?a.tool.slice(0,14):a.tool):a.activity?a.activity:a.status;
  ctx.fillStyle={working:"#5fce7a",thinking:"#c9a227",idle:"#7a6f8f",
                 waiting:"#d84f6f",done:"#5fce7a",gone:"#555"}[a.status]||"#7a6f8f";
  ctx.fillText(st.slice(0,16),(x+8)*S,(y+21.5)*S);
  const bot=a.topic||a.detail;
  if(bot){
    ctx.fillStyle=a.topic?"#9a8fc0":"#6a5f80";
    const lines=wrap(bot,15,2);
    lines.forEach((ln,idx)=>{
      ctx.fillText(ln,(x+8)*S,(y+24.5+idx*3)*S);
    });
  }
}

// ── seats + walking ─────────────────────────────────────────────────────
// chars: id → {x,y, seat:{x,y}, phase:"in"|"seated"|"out", lastStatus}
const chars = new Map();
const WALK = 0.55;                                  // grid cells per frame
function seatPos(i,perRow){
  return {x:10+(i%perRow)*34, y:14+Math.floor(i/perRow)*32};
}
function stepChars(perRow){
  const seen=new Set();
  agents.forEach((a,i)=>{
    seen.add(a.id);
    const seat=seatPos(i,perRow);
    let c=chars.get(a.id);
    if(!c){ c={x:2,y:2,seat,phase:"in",lastStatus:a.status}; chars.set(a.id,c); }
    c.seat=seat;
    const tx=c.phase==="out"?2:c.seat.x+2, ty=c.phase==="out"?2:c.seat.y;
    const dx=tx-c.x, dy=ty-c.y, d=Math.hypot(dx,dy);
    if(d<WALK){ c.x=tx;c.y=ty; if(c.phase==="in")c.phase="seated"; }
    else { c.x+=dx/d*WALK; c.y+=dy/d*WALK; }
    // sound triggers on status transitions
    if(c.lastStatus!==a.status){
      if(a.status==="waiting")chime([880,660,880]);
      else if(a.status==="done"&&a.kind==="subagent")chime([520,780]);
      c.lastStatus=a.status;
    }
  });
  for(const [id,c] of chars){
    if(!seen.has(id)){
      c.phase="out";
      const dx=2-c.x, dy=2-c.y, d=Math.hypot(dx,dy);
      if(d<WALK)chars.delete(id);
      else{c.x+=dx/d*WALK;c.y+=dy/d*WALK;}
    }
  }
}

// ── sound (off by default; toggle persists) ─────────────────────────────
let soundOn=false, audioCtx=null;
try{soundOn=localStorage.getItem("pixelOfficeSound")==="1"}catch(e){}
function chime(notes){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type="square";o.frequency.value=f;
      g.gain.setValueAtTime(0.06,audioCtx.currentTime+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+i*0.12+0.11);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+i*0.12);o.stop(audioCtx.currentTime+i*0.12+0.12);
    });
  }catch(e){}
}
const sBtn=document.getElementById("sound");
function syncSoundBtn(){sBtn.textContent=soundOn?"♪ sound on":"♪ sound off";
  sBtn.classList.toggle("on",soundOn)}
sBtn.onclick=()=>{soundOn=!soundOn;
  try{localStorage.setItem("pixelOfficeSound",soundOn?"1":"0")}catch(e){}
  if(soundOn)chime([660]); syncSoundBtn()};
syncSoundBtn();

// ── + agent button (VS Code only) ───────────────────────────────────────
const spawnBtn=document.getElementById("spawn");
if(IN_VSCODE){spawnBtn.style.display="";
  spawnBtn.onclick=()=>vsapi.postMessage({type:"spawnAgent"});}

// ── render loop ─────────────────────────────────────────────────────────
// Camera: when more agents than fit the viewport, the office pans on hover —
// hold the cursor near an edge and it auto-scrolls that way (edge-scroll).
let camX = 0, camY = 0;                     // world-cells offset of viewpoint
const EDGE_SCROLL = 42;                     // px trigger band from the edges
const SCROLL_SPEED = 2.4;                   // grid cells / frame while hovering
let mouse = { x: 0, y: 0 };                 // canvas-space cursor
document.addEventListener("mousemove", (e) => {
  const r = cv.getBoundingClientRect();
  mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
});
// Edge-scroll only makes sense on devices with a hover pointer; touch devices
// pan by one-finger drag instead (see below).
const CAN_PAN_HOVER = !window.matchMedia || window.matchMedia("(hover: hover)").matches;
// Touch panning (mobile): one-finger drag moves the camera. Cam is clamped in
// render, so we only adjust the offset here.
let dragging = null;
cv.addEventListener("touchstart", (e) => {
  const t = e.touches[0]; dragging = { x: t.clientX, y: t.clientY };
}, { passive: true });
cv.addEventListener("touchmove", (e) => {
  if (!dragging || !e.touches.length) return;
  const t = e.touches[0], dx = t.clientX - dragging.x, dy = t.clientY - dragging.y;
  dragging = { x: t.clientX, y: t.clientY };
  camX -= dx / S; camY -= dy / S;
  if (e.cancelable) e.preventDefault();
}, { passive: false });
cv.addEventListener("touchend", () => { dragging = null; });
function render(){
  frame++;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  // Pixel scale stays readable (never 2px) — crowding is handled by scrolling.
  const perRowAt=s=>Math.max(1,Math.floor((Math.floor(W/s)-8)/34));
  S=4;
  if(agents.length){
    while(S>3&&14+Math.ceil(agents.length/perRowAt(S))*32*S>H-8*S)S--;
  }
  const gw=Math.floor(W/S),gh=Math.floor(H/S);
  const perRow=Math.max(1,Math.floor((gw-8)/34));
  const rows=Math.max(1,Math.ceil(agents.length/perRow));
  const worldH=14+rows*32+8;                // world height in grid cells
  const maxCamY=Math.max(0,worldH-gh);
  // Edge-scroll on hover: pan toward the mouse at the band edges.
  if(agents.length&&maxCamY>0&&CAN_PAN_HOVER){
    if(mouse.y<EDGE_SCROLL)camY-=SCROLL_SPEED;
    else if(mouse.y>H-EDGE_SCROLL)camY+=SCROLL_SPEED;
    if(mouse.x<EDGE_SCROLL)camX-=SCROLL_SPEED;
    else if(mouse.x>W-EDGE_SCROLL)camX+=SCROLL_SPEED;
  }
  camY=Math.max(0,Math.min(maxCamY,camY));
  const maxCamX=Math.max(0,(10+perRow*34)-(gw-8));
  camX=Math.max(0,Math.min(maxCamX,camX));
  stepChars(perRow);
  // Draw the world through the camera, clipped to the viewport.
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.translate(-camX*S,-camY*S);
  drawOffice(gw,gh);
  // extend the floor below the viewport so scrolled rows have a floor
  for(let y=gh;y<worldH;y++)for(let x=0;x<gw;x+=8)
    px(x,y,8,8,((x+y)/8)%2?"#2a2138":"#251d31");
  agents.forEach((a,i)=>{
    const seat=seatPos(i,perRow);
    drawDesk(seat.x,seat.y); deskScreen(seat.x,seat.y,a);
  });
  agents.forEach((a,i)=>{
    const c=chars.get(a.id); if(!c)return;
    const seated=c.phase==="seated";
    drawChar(a,c.x,c.y,seated);
    if(seated){const seat=seatPos(i,perRow);
      drawBubble(a,seat.x+2,seat.y); label(a,seat.x,seat.y);}
  });
  // walking-out ghosts
  for(const [id,c] of chars){
    if(c.phase==="out"&&!agents.find(a=>a.id===id))
      drawChar({id,kind:"main",status:"gone",activity:""},c.x,c.y,false);
  }
  ctx.restore();
  // scroll affordance + empty/offline overlays (screen space)
  ctx.font="13px ui-monospace";ctx.textAlign="center";
  if(offline){
    ctx.fillStyle="#d84f6f";
    ctx.fillText("hermes office unreachable — "+offline,W/2,H/2);
    ctx.fillStyle="#7a6f8f";
    ctx.fillText("enable with: hermes plugins enable pixel-office, then run a session",W/2,H/2+20);
  }else if(!agents.length){
    ctx.fillStyle="#7a6f8f";
    ctx.fillText("office is empty — run something in Hermes ☤",W/2,H/2);
  }else if(maxCamY>0){
    const barH=Math.max(20,H*Math.min(1,gh/worldH));
    ctx.fillStyle="rgba(232,193,112,0.35)";
    ctx.fillRect(W-4,4+camY/(worldH-gh||1)*(H-barH-8),2,barH);
  }
  requestAnimationFrame(render);
}

// ── data feed: postMessage (VS Code) or poll /state (browser) ───────────
const TICK_COL={working:"#5fce7a",running:"#d87f4f",reading:"#7fa8d8",
  typing:"#c9a227",browsing:"#6fa8dc",delegating:"#9b6fd8",
  waiting:"#d84f6f",error:"#d84f6f",done:"#5fce7a",idle:"#7a6f8f"};
function renderTick(recent){
  const el=document.getElementById("tick"); if(!el)return;
  const rc=Array.isArray(recent)?recent:[];
  if(!rc.length){el.innerHTML='<span class="tk empty">◌ no tool calls yet</span>';return;}
  // A cosmetic name for the running tool, clipped for width.
  const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const short=t=>{const s=String(t==null?"":t).replace(/\s+/g," ");
    return s.length>34?s.slice(0,33)+"…":s;};
  el.innerHTML=rc.map(r=>{
    const col=TICK_COL[r.activity]||TICK_COL.working;
    const tool=esc(r.tool)||"tool", pre=esc(short(r.preview));
    return `<span class="tk"><span class="dot" style="background:${col}"></span>`+
      `<b>${esc(short(r.label))}</b> › ${tool}${pre?" · "+pre:""}</span>`;
  }).join("");
}
function applyState(state){
  offline=null; agents=(state&&state.agents)||[];
  renderTick(state&&state.recent);
  const n=agents.length, w=agents.filter(a=>a.status==="waiting").length;
  document.getElementById("count").textContent=
    n+" agent"+(n===1?"":"s")+(w?" · "+w+" waiting!":"");
}
if(IN_VSCODE){
  window.addEventListener("message",(ev)=>{
    const m=ev.data||{};
    if(m.type==="state")applyState(m.state);
    else if(m.type==="offline"){offline=m.url;agents=[];
      document.getElementById("count").textContent="offline";}
  });
}else{
  (async function poll(){
    try{const r=await fetch("state");applyState(await r.json());}
    catch(e){offline=String(location.host);agents=[];
      document.getElementById("count").textContent="offline";}
    setTimeout(poll,1500);
  })();
}
render();
</script>
</body>
</html>
