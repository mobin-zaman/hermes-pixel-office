<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="/manifest.json">

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

<style>
  html,body{margin:0;height:100%;background:#1a1423;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;height:100%}
  #hdr{color:#e8c170;padding:7px 14px;font-size:13px;letter-spacing:1px;
    border-bottom:2px solid #3a2f4b;display:flex;justify-content:space-between;
    align-items:center;gap:10px}
  #hdr .dim{color:#7a6f8f}
  #hdr .btn{cursor:pointer;color:#cfc4e8;border:1px solid #3a2f4b;
    border-radius:3px;padding:2px 8px;font-size:12px;background:#241c30;
    user-select:none}
  #hdr .btn:hover{border-color:#e8c170;color:#e8c170}
  #hdr .btn.on{color:#5fce7a;border-color:#5fce7a}
  #hdr .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tick{height:22px;background:#241c30;border-bottom:2px solid #3a2f4b;
    color:#cfc4e8;font-size:12px;overflow:hidden;white-space:nowrap;
    padding:3px 14px;box-sizing:border-box;letter-spacing:.3px}
  #tick b{color:#e8c170;font-weight:bold}
  #tick .tk{margin-right:22px;vertical-align:middle}
  #tick .tk.empty{color:#7a6f8f}
  #tick .dot{display:inline-block;width:7px;height:7px;border-radius:2px;
    margin-right:6px;vertical-align:1px}
  #wrap{overflow:hidden}
  #main{flex:1;display:flex;min-height:0;position:relative}
  canvas{flex:1;min-width:0;image-rendering:pixelated;width:100%;height:100%;touch-action:none;zoom:1.15}
  /* ── spotlight: the one agent you are watching, big and readable ─────── */
  #spot{position:absolute;left:10px;bottom:10px;max-width:min(560px,60%);
    background:rgba(24,18,34,.94);border:2px solid #4a3a5e;border-radius:5px;
    padding:7px 9px;font-size:13px;line-height:1.55;color:#cfc4e8;z-index:6;
    box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #spot.off{display:none}
  /* collapsed: one line only, so the canvas stays visible */
  #spot.min .think,#spot.min .last{display:none}
  #spot.min{max-width:min(560px,90%)}
  #spot .sh{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  #spot .sh b{color:#e8c9a0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    max-width:46%}
  #spot .sh .chip{font-size:10px;border:1px solid #3a2f4b;border-radius:3px;
    padding:0 5px;color:#cfc4e8;white-space:nowrap}
  #spot .sh .sp{margin-left:auto;display:flex;gap:4px}
  #spot .sh .sp span{cursor:pointer;color:#7a6f8f;border:1px solid #3a2f4b;
    border-radius:3px;padding:0 5px;font-size:11px;user-select:none}
  #spot .sh .sp span:hover{color:#e8c170;border-color:#e8c170}
  #spot .lb{display:inline-block;font-size:9.5px;letter-spacing:.6px;
    text-transform:uppercase;color:#7a6f8f;margin-right:5px}
  #spot .now{color:#5fce7a;word-break:break-word;overflow-wrap:anywhere}
  #spot .now .lb{color:#5fce7a}
  #spot .think{color:#c9a227;border-left:2px solid #4a3a1e;padding-left:6px;
    margin:4px 0;word-break:break-word;overflow-wrap:anywhere;max-height:5.2em;overflow:hidden}
  #spot .think .lb{color:#c9a227}
  #spot .ago{color:#6a5f80;font-size:10px;margin-left:6px}
  #spot .last{color:#7fa8d8;border-left:2px solid #2a3a4a;padding-left:6px;
    margin:4px 0;word-break:break-word;overflow-wrap:anywhere;max-height:5.2em;overflow:hidden}
  #spot .last .lb{color:#7fa8d8}
  #spot .empty{color:#7a6f8f}
  /* ── detail panel: what each agent is doing / thinking right now ─────── */
  #panel{width:400px;flex:0 0 400px;border-left:2px solid #3a2f4b;
    background:#1c1628;overflow-y:auto;padding:7px 8px;font-size:11.5px;
    display:flex;flex-direction:column;gap:8px;line-height:1.45}
  #panel.hide{display:none}
  #panel .empty{color:#7a6f8f;padding:8px 2px}
  .card{background:#241c30;border:1px solid #33283f;border-radius:4px;padding:6px 7px}
  .card .h{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .card .h b{color:#e8c9a0;font-weight:bold;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .card .h .chip{margin-left:auto;font-size:10px;color:#cfc4e8;border:1px solid #3a2f4b;
    border-radius:3px;padding:0 5px;white-space:nowrap}
  .card .dot{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
  .card .m{color:#7a6f8f;font-size:10.5px;margin-bottom:3px}
  .card .now{color:#5fce7a;word-break:break-word;margin-bottom:3px}
  .card .lb{display:inline-block;font-size:9.5px;letter-spacing:.6px;
    text-transform:uppercase;color:#7a6f8f;margin-right:5px}
  .card .think{color:#c9a227;border-left:2px solid #4a3a1e;padding-left:6px;
    margin:4px 0;word-break:break-word}
  .card .ago{color:#6a5f80;font-size:10px;margin-left:6px}
  .card .say{color:#9fb8d8;border-left:2px solid #2a3a4a;padding-left:6px;
    margin:4px 0;word-break:break-word}
  .card .now .lb{color:#5fce7a}
  .card ol.steps{list-style:none;margin:5px 0 0;padding:0}
  .card ol.steps li{color:#a89ec4;font-size:10.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;padding:1px 0;border-top:1px dashed #2c2338}
  .card ol.steps .ty{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px}
  @media (max-width:900px){
    /* bottom sheet over the office — tall enough to read, dismissable */
    #panel{position:absolute;left:0;right:0;bottom:0;top:50%;width:auto;
      flex:none;border-left:0;border-top:2px solid #3a2f4b;
      background:rgba(28,22,40,.97);z-index:5}
    /* the panel sheet owns the bottom half on phones — spotlight sits on top */
    #spot{bottom:auto;top:10px;left:8px;right:8px;max-width:none;font-size:12px;
      max-height:38vh;overflow:auto}
    #spot.min{max-height:none;overflow:hidden}
    #spot .think,#spot .last{max-height:3.4em}
  }
  @media (max-width:560px){
    #hdr{padding:6px 10px;flex-wrap:wrap;gap:6px 10px;font-size:12px}
    #hdr .t{font-size:11px}
    #hdr .dim{font-size:11px}
    #hdr .btn{font-size:11px;padding:3px 8px}
    #tick{font-size:11px;padding:2px 10px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <span class="t">☤ HERMES PIXEL OFFICE</span>
    <span style="flex:1"></span>
    <span class="dim" id="count">connecting…</span>
    <span class="btn on" id="spotBtn" title="big readable view of the agent you are watching">◉ focus</span>
    <span class="btn on" id="panelBtn" title="what each agent is doing and thinking">▤ detail</span>
    <span class="btn" id="sound" title="chime when an agent needs approval or a subagent finishes">♪ sound off</span>
    <span class="btn" id="spawn" style="display:none" title="open a terminal running hermes">+ agent</span>
  </div>
  <div id="tick"><span class="tk empty">◌ no tool calls yet</span></div>
  <div id="main">
    <canvas id="c"></canvas>
    <div id="spot"></div>
    <aside id="panel"></aside>
  </div>
</div>
<script>
"use strict";
// ── host detection ──────────────────────────────────────────────────────
const IN_VSCODE = typeof acquireVsCodeApi !== "undefined";
const vsapi = IN_VSCODE ? acquireVsCodeApi() : null;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let S = 4;                                  // pixel scale (auto-shrinks if crowded)
let agents = [], frame = 0, offline = null;

// ── palettes / sprites ──────────────────────────────────────────────────
const SKIN=["#f0c8a0","#c68b59","#8d5524","#ffdbac","#e0ac69","#a1665e"];
const SHIRT=["#4fa4d8","#d84f6f","#5fce7a","#c9a227","#9b6fd8","#d87f4f"];
const HAIR=["#2b2b2b","#5a3825","#c9a227","#8a8a8a","#7a3030","#4a6741"];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function px(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x*S),Math.round(y*S),w*S,h*S)}

// ── office scene ────────────────────────────────────────────────────────
function drawOffice(w,h){
  for(let y=0;y<h;y+=8)for(let x=0;x<w;x+=8)
    px(x,y,8,8,((x+y)/8)%2?"#2a2138":"#251d31");
  px(0,0,w,6,"#3a2f4b"); px(0,6,w,1,"#241c30");            // wall
  for(let x=14;x<w-14;x+=26){px(x,1,10,4,"#151022");        // windows
    px(x+1,2,8,2,"#3b5a8f");px(x+2,2,2,1,"#7fa8d8");}
  // door (agents walk in here)
  px(1,1,7,6,"#54381f"); px(2,2,5,5,"#6b4a2f"); px(6,4,1,1,"#e8c170");
  // rug
  const rw=Math.min(24,w-10); px((w-rw)/2,h-8,rw,5,"#3a2f4b");
  px((w-rw)/2+1,h-7,rw-2,3,"#443358");
  // plant, right corner
  px(w-6,h-14,3,1,"#5fce7a");px(w-7,h-15,2,2,"#5fce7a");px(w-4,h-15,2,2,"#4aa860");
  px(w-6,h-13,2,3,"#8d5524");px(w-6,h-10,3,1,"#54381f");
  // water cooler, left side
  px(2,h-14,4,5,"#7fa8d8");px(3,h-15,2,1,"#a8c8e8");px(2,h-9,4,1,"#4a4a5a");
  px(3,h-8,2,2,"#4a4a5a");
  // coffee machine on a small table, right of door
  px(10,h-11,6,1,"#6b4a2f");px(10,h-10,6,3,"#54381f");
  px(11,h-14,4,3,"#33283f");px(12,h-13,1,1,"#d84f6f");
}
function drawDesk(x,y){
  px(x,y+10,16,1,"#6b4a2f"); px(x,y+11,16,3,"#54381f");
  px(x+1,y+14,2,4,"#3c2814"); px(x+13,y+14,2,4,"#3c2814");
  px(x+10,y+4,6,5,"#191524");                    // monitor
  px(x+12,y+9,2,1,"#4a4a5a");
}
// monitor screen color reflects activity
function deskScreen(x,y,a){
  const t=frame>>3;
  let col="#0f2c1e";
  if(a){
    if(a.activity==="running")col=(t%4<2)?"#0f3c1e":"#0f2c16";       // terminal green blink
    else if(a.activity==="browsing")col=(t%6<3)?"#1e2c4a":"#24365a"; // blue page
    else if(a.activity==="typing")col=(t%2)?"#12321e":"#0f2c1e";     // fast flicker
    else if(a.status==="waiting")col="#3c1e28";                      // dim red
  }
  px(x+11,y+5,4,3,col);
}

// ── characters ──────────────────────────────────────────────────────────
function drawChar(a,fx,fy,seated){
  const h=hash(a.id), skin=SKIN[h%SKIN.length], shirt=SHIRT[(h>>3)%SHIRT.length],
        hair=HAIR[(h>>6)%HAIR.length], t=frame>>4;
  const walking = !seated;
  const bob=((a.status==="working"||walking)&&(t%2))?1:0;
  const x=fx, y=fy+bob;
  if(a.status==="gone")ctx.globalAlpha=0.35;
  // hair — style varies per agent
  px(x+2,y,4,3,hair);
  if(h%3===0)px(x+1,y+1,1,2,hair);                 // side hair
  if(h%5===0)px(x+2,y-1,4,1,hair);                 // tall hair
  px(x+2,y+2,4,3,skin);                            // face
  if(h%4===0){px(x+2,y+3,2,1,"#222a44");px(x+4,y+3,2,1,"#222a44")} // glasses
  else{px(x+3,y+3,1,1,"#111");px(x+5,y+3,1,1,"#111")}
  px(x+1,y+5,6,5,shirt);                           // body
  if(a.kind==="subagent")px(x+1,y+5,6,1,"#e8c170");// gold collar
  px(x+0,y+6,1,3,skin); px(x+7,y+6,1,3,skin);      // arms
  if(walking){                                     // legs alternate
    if(t%2){px(x+2,y+10,1,3,"#2d2d3d");px(x+5,y+11,1,2,"#2d2d3d")}
    else{px(x+2,y+11,1,2,"#2d2d3d");px(x+5,y+10,1,3,"#2d2d3d")}
  }else{
    px(x+2,y+10,1,3,"#2d2d3d"); px(x+5,y+10,1,3,"#2d2d3d");
  }
  // activity props (seated only)
  if(seated){
    if(a.activity==="typing"&&(frame>>2)%2)px(x+7,y+8,2,1,skin);      // fast hands
    else if(a.activity==="running"&&t%2)px(x+7,y+8,2,1,skin);
    else if(a.activity==="reading"){px(x+7,y+7,3,2,"#e8e0c8");px(x+8,y+7,1,2,"#b8b0a0")} // book
    else if(a.activity==="delegating"&&t%2)px(x+8,y+6,2,1,skin);      // pointing
  }
  ctx.globalAlpha=1;
}
function drawBubble(a,x,y){
  const t=frame>>4;
  if(a.status==="waiting"){                        // needs input — loud
    const by=y-6-((frame>>3)%2);
    px(x+1,by,6,4,"#e8d8b0"); px(x+2,by+4,1,1,"#e8d8b0");
    px(x+4,by+1,1,2,"#c9302f"); px(x+4,by+3,0,0,"#c9302f");
    px(x+4,by+3,1,1,"#c9302f");
  }else if(a.status==="working"&&a.tool){
    px(x+3,y-4,3,3,"#e8c170"); px(x+4,y-3,1,1,"#1a1423");
  }else if(a.status==="thinking"){
    for(let i=0;i<3;i++)px(x+2+i*2,y-3,1,1,i<=(t%4)?"#cfc4e8":"#4a4060");
  }else if(a.status==="done"){
    px(x+2,y-4,1,1,"#5fce7a");px(x+3,y-3,1,1,"#5fce7a");
    px(x+4,y-4,1,1,"#5fce7a");px(x+5,y-5,1,1,"#5fce7a");
  }else if(a.status==="idle"&&(t%8)<4){
    px(x+6,y-4,1,1,"#7a6f8f");px(x+7,y-5,1,1,"#7a6f8f");
  }
}
function wrap(s, maxLen, maxLines) {
  if (!s) return [];
  const words = String(s).trim().split(/\s+/);
  const lines = [];
  let cur = "";
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    if (!cur) {
      cur = w.length > maxLen ? w.slice(0, maxLen) : w;
    } else if ((cur + " " + w).length <= maxLen) {
      cur += " " + w;
    } else {
      lines.push(cur);
      if (lines.length >= maxLines) { cur = ""; break; }
      cur = w.length > maxLen ? w.slice(0, maxLen) : w;
    }
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  return lines;
}

function label(a,x,y){
  ctx.font="10px ui-monospace,monospace";ctx.textAlign="center";
  ctx.fillStyle=a.kind==="subagent"?"#e8c170":"#cfc4e8";
  const plat={"telegram":"tg","desktop":"dsk","cli":"cli","server":"srv","subagent":"sub"}[a.platform]||"";
  let name = a.label || "";
  // Label is now the session title, so it can be much longer than the old
  // "platform 76ff8a" form. Prefix short platform tags and wrap to the desk
  // width (17 chars covers the desk + one char of margin).
  if (plat && a.platform && name.startsWith(a.platform)) {
    name = name.slice(a.platform.length).trim();
  }
  const displayName = plat ? "[" + plat + "] " + name : name;
  wrap(displayName, 17, 2).forEach((ln, idx) => {
    ctx.fillText(ln.slice(0,17),(x+8)*S,(y+18.5+idx*3)*S);
  });
  // ponytail: title can take 2 lines; row pitch is 32 cells and the desk+
  // sprites occupy y..y+18, so 2 label lines end at y+21.5 — clear of the
  // next row. When the title wraps, status shifts down to stay under it.
  const nameLines = wrap(displayName, 17, 2).length;
  const st=a.status==="waiting"?"needs input!"
        :a.tool?(a.tool.length>14?a.tool.slice(0,14):a.tool):a.activity?a.activity:a.status;
  ctx.fillStyle={working:"#5fce7a",thinking:"#c9a227",idle:"#7a6f8f",
                 waiting:"#d84f6f",done:"#5fce7a",gone:"#555"}[a.status]||"#7a6f8f";
  const stY = y+21.5+(nameLines>1?3:0);
  ctx.fillText(st.slice(0,16),(x+8)*S,stY*S);
  // model line (blue) sits above the topic/detail lines; when present the
  // topic is capped to one line so the block stays inside the row pitch.
  const hasModel=!!a.model;
  const base = y+24.5+(nameLines>1?3:0);
  if(hasModel){
    ctx.fillStyle="#7fa8d8";
    ctx.fillText(String(a.model).slice(0,15),(x+8)*S,base*S);
  }
  const bot=a.topic||a.detail;
  if(bot){
    ctx.fillStyle=a.topic?"#9a8fc0":"#6a5f80";
    const lines=wrap(bot,15,hasModel?1:2);
    lines.forEach((ln,idx)=>{
      ctx.fillText(ln,(x+8)*S,(base+(hasModel?3:0)+idx*3)*S);
    });
  }
}

// ── seats + walking ─────────────────────────────────────────────────────
// chars: id → {x,y, seat:{x,y}, phase:"in"|"seated"|"out", lastStatus}
const chars = new Map();
const WALK = 0.55;                                  // grid cells per frame
function seatPos(i,perRow){
  return {x:10+(i%perRow)*34, y:14+Math.floor(i/perRow)*32};
}
function stepChars(perRow){
  const seen=new Set();
  agents.forEach((a,i)=>{
    seen.add(a.id);
    const seat=seatPos(i,perRow);
    let c=chars.get(a.id);
    if(!c){ c={x:2,y:2,seat,phase:"in",lastStatus:a.status}; chars.set(a.id,c); }
    c.seat=seat;
    const tx=c.phase==="out"?2:c.seat.x+2, ty=c.phase==="out"?2:c.seat.y;
    const dx=tx-c.x, dy=ty-c.y, d=Math.hypot(dx,dy);
    if(d<WALK){ c.x=tx;c.y=ty; if(c.phase==="in")c.phase="seated"; }
    else { c.x+=dx/d*WALK; c.y+=dy/d*WALK; }
    // sound triggers on status transitions
    if(c.lastStatus!==a.status){
      if(a.status==="waiting")chime([880,660,880]);
      else if(a.status==="done"&&a.kind==="subagent")chime([520,780]);
      c.lastStatus=a.status;
    }
  });
  for(const [id,c] of chars){
    if(!seen.has(id)){
      c.phase="out";
      const dx=2-c.x, dy=2-c.y, d=Math.hypot(dx,dy);
      if(d<WALK)chars.delete(id);
      else{c.x+=dx/d*WALK;c.y+=dy/d*WALK;}
    }
  }
}

// ── sound (off by default; toggle persists) ─────────────────────────────
let soundOn=false, audioCtx=null;
try{soundOn=localStorage.getItem("pixelOfficeSound")==="1"}catch(e){}
function chime(notes){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type="square";o.frequency.value=f;
      g.gain.setValueAtTime(0.06,audioCtx.currentTime+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+i*0.12+0.11);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+i*0.12);o.stop(audioCtx.currentTime+i*0.12+0.12);
    });
  }catch(e){}
}
const sBtn=document.getElementById("sound");
function syncSoundBtn(){sBtn.textContent=soundOn?"♪ sound on":"♪ sound off";
  sBtn.classList.toggle("on",soundOn)}
sBtn.onclick=()=>{soundOn=!soundOn;
  try{localStorage.setItem("pixelOfficeSound",soundOn?"1":"0")}catch(e){}
  if(soundOn)chime([660]); syncSoundBtn()};
syncSoundBtn();

// ── + agent button (VS Code only) ───────────────────────────────────────
const spawnBtn=document.getElementById("spawn");
if(IN_VSCODE){spawnBtn.style.display="";
  spawnBtn.onclick=()=>vsapi.postMessage({type:"spawnAgent"});}

// ── render loop ─────────────────────────────────────────────────────────
// Camera: when more agents than fit the viewport, the office pans on hover —
// hold the cursor near an edge and it auto-scrolls that way (edge-scroll).
let camX = 0, camY = 0;                     // world-cells offset of viewpoint
const EDGE_SCROLL = 42;                     // px trigger band from the edges
const SCROLL_SPEED = 2.4;                   // grid cells / frame while hovering
let mouse = { x: 0, y: 0 };                 // canvas-space cursor
document.addEventListener("mousemove", (e) => {
  const r = cv.getBoundingClientRect();
  mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
});
// Edge-scroll only makes sense on devices with a hover pointer; touch devices
// pan by one-finger drag instead (see below).
const CAN_PAN_HOVER = !window.matchMedia || window.matchMedia("(hover: hover)").matches;
// Touch panning (mobile): one-finger drag moves the camera. Cam is clamped in
// render, so we only adjust the offset here.
let dragging = null;
cv.addEventListener("touchstart", (e) => {
  const t = e.touches[0]; dragging = { x: t.clientX, y: t.clientY };
}, { passive: true });
cv.addEventListener("touchmove", (e) => {
  if (!dragging || !e.touches.length) return;
  const t = e.touches[0], dx = t.clientX - dragging.x, dy = t.clientY - dragging.y;
  dragging = { x: t.clientX, y: t.clientY };
  camX -= dx / S; camY -= dy / S;
  if (e.cancelable) e.preventDefault();
}, { passive: false });
cv.addEventListener("touchend", () => { dragging = null; });
// Double-tap the office to toggle fullscreen (gesture-gated — the canvas sits
// behind Chrome's URL bar until then). Use pointerdown (fires immediately and
// reliably from both synthetic and real touches on Chrome/Go). Harmless in VS Code.
let lastTap = 0;
cv.addEventListener("dblclick", requestFullWin);
cv.addEventListener("pointerdown", () => {
  const now = Date.now();
  if (now - lastTap < 600) requestFullWin();
  lastTap = now;
});
function requestFullWin() {
  const el = document.fullscreenElement ? document : cv;
  if (document.fullscreenEnabled) {
    (document.fullscreenElement ? document.exitFullscreen() : cv.requestFullscreen())
      .catch(() => {});
  }
}
function render(){
  frame++;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  // Pixel scale stays readable (never 2px) — crowding is handled by scrolling.
  const perRowAt=s=>Math.max(1,Math.floor((Math.floor(W/s)-8)/34));
  S=4;
  if(agents.length){
    while(S>3&&14+Math.ceil(agents.length/perRowAt(S))*32*S>H-8*S)S--;
  }
  const gw=Math.floor(W/S),gh=Math.floor(H/S);
  const perRow=Math.max(1,Math.floor((gw-8)/34));
  const rows=Math.max(1,Math.ceil(agents.length/perRow));
  const worldH=14+rows*32+8;                // world height in grid cells
  const maxCamY=Math.max(0,worldH-gh);
  // Edge-scroll on hover: pan toward the mouse at the band edges.
  if(agents.length&&maxCamY>0&&CAN_PAN_HOVER){
    if(mouse.y<EDGE_SCROLL)camY-=SCROLL_SPEED;
    else if(mouse.y>H-EDGE_SCROLL)camY+=SCROLL_SPEED;
    if(mouse.x<EDGE_SCROLL)camX-=SCROLL_SPEED;
    else if(mouse.x>W-EDGE_SCROLL)camX+=SCROLL_SPEED;
  }
  camY=Math.max(0,Math.min(maxCamY,camY));
  const maxCamX=Math.max(0,(10+perRow*34)-(gw-8));
  camX=Math.max(0,Math.min(maxCamX,camX));
  stepChars(perRow);
  // Draw the world through the camera, clipped to the viewport.
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.translate(-camX*S,-camY*S);
  drawOffice(gw,gh);
  // extend the floor below the viewport so scrolled rows have a floor
  for(let y=gh;y<worldH;y++)for(let x=0;x<gw;x+=8)
    px(x,y,8,8,((x+y)/8)%2?"#2a2138":"#251d31");
  agents.forEach((a,i)=>{
    const seat=seatPos(i,perRow);
    drawDesk(seat.x,seat.y); deskScreen(seat.x,seat.y,a);
  });
  agents.forEach((a,i)=>{
    const c=chars.get(a.id); if(!c)return;
    const seated=c.phase==="seated";
    drawChar(a,c.x,c.y,seated);
    if(seated){const seat=seatPos(i,perRow);
      drawBubble(a,seat.x+2,seat.y); label(a,seat.x,seat.y);}
  });
  // walking-out ghosts
  for(const [id,c] of chars){
    if(c.phase==="out"&&!agents.find(a=>a.id===id))
      drawChar({id,kind:"main",status:"gone",activity:""},c.x,c.y,false);
  }
  ctx.restore();
  // scroll affordance + empty/offline overlays (screen space)
  ctx.font="13px ui-monospace";ctx.textAlign="center";
  if(offline){
    ctx.fillStyle="#d84f6f";
    ctx.fillText("hermes office unreachable — "+offline,W/2,H/2);
    ctx.fillStyle="#7a6f8f";
    ctx.fillText("enable with: hermes plugins enable pixel-office, then run a session",W/2,H/2+20);
  }else if(!agents.length){
    ctx.fillStyle="#7a6f8f";
    ctx.fillText("office is empty — run something in Hermes ☤",W/2,H/2);
  }else if(maxCamY>0){
    const barH=Math.max(20,H*Math.min(1,gh/worldH));
    ctx.fillStyle="rgba(232,193,112,0.35)";
    ctx.fillRect(W-4,4+camY/(worldH-gh||1)*(H-barH-8),2,barH);
  }
  requestAnimationFrame(render);
}

// ── data feed: postMessage (VS Code) or poll /state (browser) ───────────
const TICK_COL={working:"#5fce7a",running:"#d87f4f",reading:"#7fa8d8",
  typing:"#c9a227",browsing:"#6fa8dc",delegating:"#9b6fd8",
  waiting:"#d84f6f",error:"#d84f6f",done:"#5fce7a",idle:"#7a6f8f"};
function renderTick(recent){
  const el=document.getElementById("tick"); if(!el)return;
  const rc=Array.isArray(recent)?recent:[];
  if(!rc.length){el.innerHTML='<span class="tk empty">◌ no tool calls yet</span>';return;}
  // A cosmetic name for the running tool, clipped for width.
  const esc=pEsc;
  const short=t=>{const s=String(t==null?"":t).replace(/\s+/g," ");
    return s.length>34?s.slice(0,33)+"…":s;};
  el.innerHTML=rc.map(r=>{
    const col=TICK_COL[r.activity]||TICK_COL.working;
    const tool=esc(r.tool)||"tool", pre=esc(short(r.preview));
    const res=r.status==="error"?'<span style="color:#d84f6f"> ✗</span>'
      :r.status==="ok"?`<span style="color:#5fce7a"> ✓${r.dur?' '+r.dur+'ms':''}</span>`:"";
    return `<span class="tk"><span class="dot" style="background:${col}"></span>`+
      `<b>${esc(short(r.label))}</b> › ${tool}${pre?" · "+pre:""}${res}</span>`;
  }).join("");
}
// ── detail panel: what each agent is doing / thinking right now ──────────
// Backend folds /state from state.db's live transcript tail (`live`), so the
// thinking text below is the agent's actual latest reasoning, per poll.
const panelEl=document.getElementById("panel"), panelBtn=document.getElementById("panelBtn");
let panelOn=window.innerWidth>=900;
try{const v=localStorage.getItem("pixelOfficePanel"); if(v!==null)panelOn=v==="1";}catch(e){}
function syncPanel(){panelEl.classList.toggle("hide",!panelOn);
  panelBtn.classList.toggle("on",panelOn)}
panelBtn.onclick=()=>{panelOn=!panelOn;
  try{localStorage.setItem("pixelOfficePanel",panelOn?"1":"0")}catch(e){}
  syncPanel()};
syncPanel();
// Click a card in the detail panel → spotlight that agent (click again unpin).
panelEl.addEventListener("click",(e)=>{
  const c=e.target.closest(".card"); if(!c)return;
  const id=c.getAttribute("data-agent"); if(!id)return;
  spotPin=(spotPin===id)?null:id;
  spotSig=""; renderSpot(agents);
});
const STCOL={working:"#5fce7a",thinking:"#c9a227",idle:"#7a6f8f",
  waiting:"#d84f6f",done:"#5fce7a",gone:"#555"};
const TYPCOL={think:"#c9a227",say:"#7fa8d8",tool:"#9b6fd8",user:"#5fce7a"};
// Escape for HTML text AND quoted attribute values — labels/preview/think are
// agent-authored text and end up inside data-agent="…" attributes.
const pEsc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const flat=t=>String(t==null?"":t).replace(/\s+/g," ").trim();
// The newest part of a thought/speech is what the agent is on right now.
function tail(s,n){s=flat(s);return s.length>n?"…"+s.slice(-n):s;}
// A command/path reads from the START; keep its head.
function head(s,n){s=flat(s);return s.length>n?s.slice(0,n-1)+"…":s;}
function ago(ts){if(!ts)return"";const d=Math.max(0,Date.now()/1000-ts);
  return d<1?"now":d<60?Math.round(d)+"s ago":d<3600?Math.round(d/60)+"m ago"
    :Math.round(d/3600)+"h ago";}
// ── shared line builders (spotlight + panel render the same fields) ─────
function nowLine(a){
  const st=a.status||"idle";
  return st==="waiting"?"needs input! "+(a.detail||"")
    :a.tool?a.tool+(a.detail?" › "+head(a.detail,320):""):(a.activity||st);
}
function lastCallLine(a){
  const l=a.last_tool||{};
  return l.tool?l.tool+(l.detail?" › "+head(l.detail,260):""):"";
}
function resultLine(L){
  if(!L.result)return "";
  return (L.result_tool?L.result_tool+" · ":"")+tail(L.result,400);
}
let panelSig="";
function card(a){
  const L=a.live||{}, st=a.status||"idle";
  const now=nowLine(a);
  const lastCall=lastCallLine(a);
  const steps=(L.steps||[]).map(s=>
    `<li><span class="ty" style="color:${TYPCOL[s.t]||"#888"}">${pEsc(s.t)}</span> `+
    `${pEsc(flat((s.n?s.n+" · ":"")+(s.p||"")).slice(0,170))}</li>`).join("");
  const think=flat(L.think), say=flat(L.say);
  return `<div class="card" data-agent="${pEsc(a.id||"")}">
    <div class="h"><span class="dot" style="background:${STCOL[st]||"#7a6f8f"}"></span>
      <b>${pEsc(a.label||a.id)}</b><span class="chip">${pEsc(st)}</span></div>
    <div class="m">${pEsc([a.platform||(a.kind==="subagent"?"subagent":""),
      a.model,ago(L.last_ts||a.updated_at)].filter(Boolean).join(" · "))}</div>
    <div class="now"><span class="lb">now</span>${pEsc(head(now,320))}</div>
    ${lastCall?`<div class="last"><span class="lb">last call</span>${pEsc(lastCall)}</div>`:""}
    ${think?`<div class="think"><span class="lb">thinking</span>${pEsc(tail(think,460))}`+
      `<span class="ago">${pEsc(ago(L.think_ts||L.last_ts))}</span></div>`:""}
    ${say?`<div class="say"><span class="lb">said</span>${pEsc(tail(say,240))}</div>`:""}
    ${L.result?`<div class="last"><span class="lb">last result</span>${pEsc(resultLine(L))}</div>`:""}
    ${steps?`<ol class="steps">${steps}</ol>`:""}
  </div>`;
}
function renderPanel(list){
  if(!panelOn)return;
  const sig=JSON.stringify(list.map(a=>[a.id,a.status,a.tool,a.detail,a.label,a.model,
    (a.live||{}).think,(a.live||{}).say,(a.live||{}).result,
    (a.live||{}).result_tool,((a.live||{}).steps||[]).length]));
  if(sig===panelSig)return;              // no change → keep scroll position
  panelSig=sig;
  const keep=panelEl.scrollTop;
  panelEl.innerHTML=list.length?list.map(card).join("")
    :'<div class="empty">office is empty — run something in Hermes ☤</div>';
  panelEl.scrollTop=keep;
}
// ── spotlight: one agent, big and readable ──────────────────────────────
// Focus follows the most recently active agent; click a panel card (or use
// ◀ ▶) to pin a specific one. Everything here is read from /state only.
const spotEl=document.getElementById("spot"), spotBtn=document.getElementById("spotBtn");
let spotOn=true, spotPin=null, spotMin=false;
try{const v=localStorage.getItem("pixelOfficeSpot"); if(v!==null)spotOn=v==="1";}catch(e){}
try{const v=localStorage.getItem("pixelOfficeSpotMin"); if(v!==null)spotMin=v==="1";
}catch(e){}
function syncSpot(){spotEl.classList.toggle("off",!spotOn);
  spotEl.classList.toggle("min",spotMin);
  spotBtn.classList.toggle("on",spotOn)}
spotBtn.onclick=()=>{spotOn=!spotOn;
  try{localStorage.setItem("pixelOfficeSpot",spotOn?"1":"0")}catch(e){}
  syncSpot()};
syncSpot();
function focusAgent(list){
  if(!list.length)return null;
  if(spotPin){const p=list.find(a=>a.id===spotPin); if(p)return p;}
  // most recently touched agent wins (live.last_ts, else updated_at)
  return list.slice().sort((x,y)=>
    ((y.live&&y.live.last_ts)||y.updated_at||0)-((x.live&&x.live.last_ts)||x.updated_at||0))[0];
}
let spotSig="";
function renderSpot(list){
  if(!spotOn){spotEl.innerHTML="";spotSig="";return}
  const a=focusAgent(list);
  if(!a){spotEl.innerHTML='<div class="empty">office is empty — run something in Hermes ☤</div>';
    spotSig="";return}
  const L=a.live||{}, st=a.status||"idle";
  const now=nowLine(a);
  const lastCall=lastCallLine(a);
  const sig=JSON.stringify([a.id,st,a.tool,a.detail,now,L.think,L.result,L.last_ts,
    lastCall,a.label,a.model,L.result_tool]);
  if(sig===spotSig)return;
  spotSig=sig;
  const idx=list.findIndex(x=>x.id===a.id);
  spotEl.innerHTML=`<div class="sh">
      <span class="dot" style="background:${STCOL[st]||"#7a6f8f"}"></span>
      <b>${pEsc(a.label||a.id)}</b>
      <span class="chip">${pEsc(st)}</span>
      <span class="chip">${pEsc(flat(a.model)||"—")}</span>
      <span class="chip">${pEsc(ago(L.last_ts||a.updated_at))}</span>
      <span class="sp"><span id="spotMin" title="collapse / expand">${spotMin?"▸":"▾"}</span><span id="spotPrev">◀</span><span id="spotNext">▶</span></span>
    </div>
    <div class="now"><span class="lb">now</span>${pEsc(head(now,400))}</div>
    ${lastCall?`<div class="last"><span class="lb">last call</span>${pEsc(lastCall)}</div>`:""}
    ${L.think?`<div class="think"><span class="lb">thinking</span>${pEsc(tail(L.think,700))}`+
      `<span class="ago">${pEsc(ago(L.think_ts||L.last_ts))}</span></div>`:""}
    ${L.result?`<div class="last"><span class="lb">last result</span>${pEsc(resultLine(L))}</div>`:""}`;
  const step=d=>{spotPin=list[(idx+d+list.length)%list.length].id;spotSig="";renderSpot(list)};
  const p=document.getElementById("spotPrev"), n=document.getElementById("spotNext");
  if(p)p.onclick=()=>step(-1);
  if(n)n.onclick=()=>step(1);
  const mn=document.getElementById("spotMin");
  if(mn)mn.onclick=()=>{spotMin=!spotMin;
    try{localStorage.setItem("pixelOfficeSpotMin",spotMin?"1":"0")}catch(e){}
    syncSpot();spotSig="";renderSpot(list)};
}
function applyState(state){
  offline=null; agents=(state&&state.agents)||[];
  renderTick(state&&state.recent);
  renderSpot(agents);
  renderPanel(agents);
  const n=agents.length, w=agents.filter(a=>a.status==="waiting").length;
  document.getElementById("count").textContent=
    n+" agent"+(n===1?"":"s")+(w?" · "+w+" waiting!":"");
}
if(IN_VSCODE){
  window.addEventListener("message",(ev)=>{
    const m=ev.data||{};
    if(m.type==="state")applyState(m.state);
    else if(m.type==="offline"){offline=m.url;agents=[];
      document.getElementById("count").textContent="offline";}
  });
}else{
  (async function poll(){
    try{const r=await fetch("state");applyState(await r.json());}
    catch(e){offline=String(location.host);agents=[];
      document.getElementById("count").textContent="offline";}
    setTimeout(poll,1500);
  })();
}
render();
</script>
</body>
